services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.demo
    ports:
      - "127.0.0.1:${SMARTVOYAGE_API_HOST_PORT:-8080}:8080"
    environment:
      SMARTVOYAGE_MODE: demo
      SMARTVOYAGE_APP_DB: /data/smartvoyage.sqlite3
      SMARTVOYAGE_COOKIE_SECURE: ${SMARTVOYAGE_COOKIE_SECURE:-0}
    volumes:
      - application_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health',timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  application_data:
